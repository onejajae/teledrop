services:
  teledrop:
    image: ghcr.io/onejajae/teledrop:latest
    container_name: teledrop
    restart: unless-stopped
    ports:
      - 80:8080/tcp
    volumes:
      - ./.local/share:/app/share
    environment:
      - TZ=Asia/Seoul
      - WEB_USERNAME=
      - WEB_PASSWORD=
      - TELEDROP_API_KEY=
      - SHARE_DIRECTORY=/app/share
      - MAX_UPLOAD_BYTES=1073741824
