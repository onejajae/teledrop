<div class="mx-auto w-full max-w-sm space-y-4 text-center">
  <div>
    <h3 class="text-lg font-semibold">비밀번호 입력</h3>
    <p class="mt-1 text-sm opacity-70">이 파일은 비밀번호로 보호되어 있습니다.</p>
  </div>
  <form hx-get="/drop-detail" hx-target="#main-panel" hx-swap="innerHTML" class="flex flex-col gap-4 text-left">
    <input type="hidden" name="slug" value="{{ selected_key }}" />
    <div class="w-full space-y-1">
      <label class="block text-sm" for="detail-password-input">
        비밀번호
      </label>
      <input type="password" id="detail-password-input" name="password" placeholder="비밀번호를 입력하세요"
        class="input input-bordered w-full" />
      {% if detail_error_message %}
      <p class="mt-2 text-xs text-error">{{ detail_error_message }}</p>
      {% endif %}
    </div>
    <button type="submit" class="btn btn-primary">확인</button>
  </form>
  {% if is_login %}
  <p class="text-xs opacity-60">로그인 중이라면 상세 화면에서 비밀번호 변경을 시도할 수 있습니다.</p>
  {% endif %}
</div>
