{% from "macros/icons.html" import icon_upload %}
{% if not is_login %}
<div class="alert alert-info shadow-lg">
  <span>파일 업로드는 로그인 후 사용할 수 있습니다.</span>
</div>
{% else %}
{% if upload_error_message %}
<div class="alert alert-error shadow-lg mb-4">
  <span>{{ upload_error_message }}</span>
</div>
{% endif %}
<section class="td-section">
  <div class="td-section-body">
    <div class="space-y-2 text-center">
      <h2 class="td-section-title">업로드</h2>
      <p class="text-sm opacity-70">파일을 올리면 private 상태로 생성되고, 다음 화면에서 공유 설정을 진행합니다.</p>
    </div>
    <form id="upload-form" method="post" action="/actions/drop/upload" enctype="multipart/form-data"
      hx-encoding="multipart/form-data" hx-post="/actions/drop/upload" hx-target="#main-panel" hx-swap="innerHTML"
      class="space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token or '' }}" />
      <input type="hidden" name="user_only" value="true" />
      <input id="upload-file" type="file" name="file" required class="hidden" />

      <label id="upload-dropzone" for="upload-file"
        class="flex cursor-pointer flex-col items-center justify-center gap-3 rounded-box border-2 border-dashed border-base-300 px-4 py-8 text-center hover:bg-base-200">
        <div id="upload-drop-placeholder" class="space-y-2">
          {{ icon_upload(class="mx-auto h-10 w-10 opacity-60") }}
          <p class="text-sm opacity-80">
            <span class="font-semibold">클릭하여 업로드</span> 또는 끌어서 놓기
          </p>
        </div>
        <div id="upload-preview" class="hidden w-full space-y-3">
          <img id="upload-preview-image" alt="업로드 미리보기" class="mx-auto hidden max-h-72 rounded-xl" />
          <video id="upload-preview-video" class="mx-auto hidden max-h-72 rounded-xl" controls>
            <source id="upload-preview-video-source" />
          </video>
          <div id="upload-preview-file" class="mx-auto hidden w-full max-w-xs rounded-box bg-base-200 p-4 text-sm">
            선택한 파일
          </div>
          <p id="upload-filename" class="text-sm font-semibold"></p>
        </div>
      </label>

      <div>
        <button id="upload-submit" type="submit" class="btn btn-primary w-full" disabled>
          업로드 후 관리로 이동
        </button>
      </div>

      <div class="mt-2 text-center hidden" id="upload-progress">
        <progress id="progress" class="progress progress-primary w-full" value="0" max="100"></progress>
      </div>

    </form>
  </div>
</section>
{% endif %}
