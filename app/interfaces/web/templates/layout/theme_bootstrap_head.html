<script>
  (function () {
    var lightThemeColor = "#0ea5e9";
    var darkThemeColor = "#1f2937";
    try {
      var stored = localStorage.getItem("color-theme");
      var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      var theme = stored || (prefersDark ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
      document.documentElement.style.colorScheme = theme === "dark" ? "dark" : "light";
      var themeColorMeta = document.querySelector('meta[name="theme-color"]');
      if (themeColorMeta) {
        themeColorMeta.setAttribute("content", theme === "dark" ? darkThemeColor : lightThemeColor);
      }
    } catch (_err) {
      document.documentElement.setAttribute("data-theme", "light");
      document.documentElement.style.colorScheme = "light";
      var fallbackThemeColorMeta = document.querySelector('meta[name="theme-color"]');
      if (fallbackThemeColorMeta) {
        fallbackThemeColorMeta.setAttribute("content", lightThemeColor);
      }
    }
  })();
</script>
<style>
  html {
    background-color: #ffffff;
  }

  html[data-theme="dark"] {
    background-color: #1f2937;
  }

  body {
    background-color: transparent;
  }
</style>
