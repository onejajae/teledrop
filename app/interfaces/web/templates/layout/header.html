<header class="space-y-2">
  <div class="flex items-center justify-between">
    <div>
      {% if is_login %}
      <form method="post" action="/actions/auth/logout" hx-post="/actions/auth/logout" hx-swap="none">
        <input type="hidden" name="csrf_token" value="{{ csrf_token or '' }}" />
        <button type="submit" class="btn btn-ghost btn-sm normal-case">로그아웃</button>
      </form>
      {% endif %}
    </div>
    <div class="flex items-center gap-1">
      <a class="btn btn-ghost btn-sm btn-square" href="https://github.com/onejajae/teledrop" target="_blank"
        rel="noopener noreferrer" aria-label="GitHub" title="GitHub">
        <span class="flex h-4 w-4 items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 shrink-0 fill-current" viewBox="0 0 16 16"
            aria-hidden="true">
            <path fill-rule="evenodd"
              d="M8 0C3.58 0 0 3.58 0 8a8 8 0 0 0 5.47 7.59c.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.5-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.65 7.65 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z" />
          </svg>
        </span>
      </a>
      <button id="theme-toggle" type="button" class="btn btn-ghost btn-sm btn-square swap swap-rotate"
        aria-label="테마 전환" aria-pressed="false">
        <!-- sun icon (shown in light mode) -->
        <svg class="swap-off h-4 w-4 fill-current" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path
            d="M5.64 17l-.71.71a1 1 0 0 0 0 1.41 1 1 0 0 0 1.41 0l.71-.71A1 1 0 0 0 5.64 17zM5 12a1 1 0 0 0-1-1H3a1 1 0 0 0 0 2h1a1 1 0 0 0 1-1zm7-7a1 1 0 0 0 1-1V3a1 1 0 1 0-2 0v1a1 1 0 0 0 1 1zM5.64 7.05a1 1 0 0 0 .7.29 1 1 0 0 0 .71-.29 1 1 0 0 0 0-1.41l-.71-.71A1 1 0 0 0 4.93 6.34zm12.02 9.36-.71.71a1 1 0 0 0 0 1.41 1 1 0 0 0 1.41 0l.71-.71a1 1 0 1 0-1.41-1.41zM21 11h-1a1 1 0 0 0 0 2h1a1 1 0 0 0 0-2zm-2.64-7.95a1 1 0 0 0-1.41 0l-.71.71a1 1 0 1 0 1.41 1.41l.71-.71a1 1 0 0 0 0-1.41zM12 6.5A5.5 5.5 0 1 0 17.5 12 5.51 5.51 0 0 0 12 6.5zm0 9A3.5 3.5 0 1 1 15.5 12 3.5 3.5 0 0 1 12 15.5zM12 20a1 1 0 0 0-1 1v1a1 1 0 1 0 2 0v-1a1 1 0 0 0-1-1z" />
        </svg>
        <!-- moon icon (shown in dark mode) -->
        <svg class="swap-on h-4 w-4 fill-current" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path
            d="M21.64 13a1 1 0 0 0-1.05-.14 8.05 8.05 0 0 1-3.37.73A8.15 8.15 0 0 1 9.08 5.49a8.59 8.59 0 0 1 .25-2A1 1 0 0 0 8 2.36a10.14 10.14 0 1 0 14 11.69 1 1 0 0 0-.36-1.05zm-9.5 6.69A8.14 8.14 0 0 1 7.08 5.22v.27A10.15 10.15 0 0 0 17.22 15.63a9.79 9.79 0 0 0 2.1-.22A8.11 8.11 0 0 1 12.14 19.73z" />
        </svg>
      </button>
    </div>
  </div>
  <div class="flex justify-center">
    <div class="m-3 w-full max-w-sm">
      <a href="/" class="block" aria-label="teledrop">
        <span class="td-logo-wordmark" aria-hidden="true"></span>
      </a>
    </div>
  </div>
</header>
