name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # PR은 새 커밋이 오면 이전 실행을 취소하고, main은 이미지 게시가 끊기지 않도록 순서대로 실행한다.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/Teledrop.Infrastructure/package-lock.json

      - name: Install frontend packages and PDF.js
        run: npm --prefix src/Teledrop.Infrastructure ci

      - name: Restore solution
        run: dotnet restore Teledrop.slnx

      - name: Build solution
        run: dotnet build Teledrop.slnx --configuration Release --no-restore

      - name: Install Chromium and system dependencies
        run: node tests/Teledrop.Tests/bin/Release/net10.0/.playwright/package/cli.js install --with-deps chromium

      - name: Run all tests
        run: >-
          dotnet test tests/Teledrop.Tests/Teledrop.Tests.csproj
          --configuration Release --no-build
          --logger "trx;LogFileName=tests.trx"
          --results-directory TestResults

      - name: Publish application
        run: >-
          dotnet publish src/Teledrop/Teledrop.csproj
          --configuration Release --no-build
          --output "${{ runner.temp }}/teledrop-publish"
          /p:UseAppHost=false

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 1

  docker:
    name: Build and push container image
    needs: test
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
