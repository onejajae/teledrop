name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Node.js for Playwright installation
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Restore solution
        run: dotnet restore Teledrop.slnx

      - name: Build solution
        run: dotnet build Teledrop.slnx --configuration Release --no-restore

      - name: Install Chromium and system dependencies
        run: node tests/Teledrop.Tests/bin/Release/net10.0/.playwright/package/cli.js install --with-deps chromium

      - name: Run all tests
        run: >-
          dotnet test tests/Teledrop.Tests/Teledrop.Tests.csproj
          --configuration Release --no-build
          --logger "trx;LogFileName=tests.trx"
          --results-directory TestResults

      - name: Publish application
        run: >-
          dotnet publish src/Teledrop/Teledrop.csproj
          --configuration Release --no-build
          --output "${{ runner.temp }}/teledrop-publish"
          /p:UseAppHost=false

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Build container image
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=nightly,enable=${{ github.ref == 'refs/heads/devel' }}
            type=sha

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/devel') }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/devel') }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=teledrop
          cache-to: type=gha,scope=teledrop,mode=max
