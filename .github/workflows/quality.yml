name: Quality

on:
  pull_request:
  push:
    branches: ["main", "devel"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      UV_VERSION: "0.11.7"
      RUFF_VERSION: "0.15.12"
      PIP_AUDIT_VERSION: "2.10.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        run: |
          python -m pip install --user "uv==${UV_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sync Python dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -q

      - name: Run Ruff
        run: uvx --from "ruff==${RUFF_VERSION}" ruff check .

      - name: Audit Python dependencies
        continue-on-error: true
        shell: bash
        run: |
          requirements_file="$(mktemp)"
          trap 'rm -f "$requirements_file"' EXIT
          uv export \
            --format requirements.txt \
            --no-dev \
            --no-emit-project \
            --no-hashes \
            --frozen \
            --output-file "$requirements_file"
          uvx --from "pip-audit==${PIP_AUDIT_VERSION}" pip-audit \
            --requirement "$requirements_file" \
            --strict \
            --no-deps \
            --disable-pip \
            --progress-spinner off

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui-build/package-lock.json

      - name: Install Node dependencies
        working-directory: ui-build
        run: npm ci

      - name: Build UI assets
        working-directory: ui-build
        run: npm run build

      - name: Audit Node dependencies
        working-directory: ui-build
        run: npm audit --audit-level=high
