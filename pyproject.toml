[project]
name = "teledrop"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "fastapi[standard]>=0.135.1",
    "pydantic-settings>=2.13.1",
    "sqlmodel>=0.0.37",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint.per-file-ignores]
"app/core/auth/__init__.py" = ["F401"]
"app/core/utils/__init__.py" = ["F401"]
"app/infrastructure/db/schema.py" = ["F401"]
"app/interfaces/web/routes/actions_drop.py" = ["F401"]
"app/interfaces/web/router.py" = ["F401"]
"tests/integration/application/drop/test_drop_use_cases.py" = ["E731"]
"tests/integration/infrastructure/db/test_api_key_repository.py" = ["F401"]
"tests/smoke/web/test_web_actions_smoke.py" = ["F841"]
